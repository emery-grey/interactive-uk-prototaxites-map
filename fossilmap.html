    const content = `
        <div>
            <h3>${props.SPECIES}</h3>

            <p>Paleo Environment: ${props.PAL_CLIM} ${props.PAL_ENV}</p>

        </div>
    `;
    
    // Add popup to map
    popup.setLngLat(coords).setHTML(content).addTo(map);
});
